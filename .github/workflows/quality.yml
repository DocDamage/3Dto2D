name: quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install project
        run: python -m pip install --no-deps -e . && python -m pip install "flake8>=7,<8"
      - name: Python syntax
        run: python -m compileall -q app -x "app[\\/](vendor|input|scratch|\\.venv)"
      - name: Critical Python lint
        run: python -m flake8 app tests --exclude=vendor,input,scratch,.venv --select=E9,F63,F7,F82
      - name: Test suite
        run: python -m pytest -q
      - name: JavaScript syntax
        shell: pwsh
        run: Get-ChildItem app/web/js/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
