<section class="view" id="view-convert">
      <div class="section-title"><p class="eyebrow">Existing video</p><h2>Convert Video</h2></div>
      <div class="grid-2">
        <form class="card form" id="convertForm">
          <div class="dropzone" id="dropzone">
            <input type="file" id="videoFile" accept="video/*" />
            <div class="drop-icon">⬡</div>
            <b>Drop a ComfyUI/WAN video here</b>
            <span>or click to upload into the active project references</span>
          </div>
          <label>Video path<input name="input" id="videoPath" placeholder="C:\ComfyUI\output\example.mp4 or uploaded path" /></label>
          <label>Output folder<input name="output" placeholder="Optional. Example: output\hero_walk_sprite" /></label>
          <div class="row">
            <label>FPS<input name="fps" value="12" /></label>
            <label>Cell size<input name="cell_size" value="512x512" /></label>
          </div>
          <label>Key color<input name="key_color" value="auto" /></label>
          <details class="collapsible-section">
            <summary>Native polish</summary>
            <div class="row">
              <label>Matting
                <select name="matting_engine">
                  <option value="chroma" selected>Chroma key</option>
                  <option value="pixel-art">Pixel-art hard edge</option>
                  <option value="birefnet">BiRefNet matting</option>
                  <option value="rembg">rembg</option>
                </select>
              </label>
              <label>Interpolate FPS<input name="interpolate_fps" placeholder="Optional, e.g. 24" /></label>
            </div>
            <div class="row">
              <label>Pixel palette
                <select name="pixel_cleanup_palette">
                  <option value="">Learned Oklab</option>
                  <option value="pico8">PICO-8</option>
                  <option value="gameboy">Game Boy</option>
                  <option value="nes">NES</option>
                </select>
              </label>
              <label>Dither
                <select name="pixel_cleanup_dither_mode">
                  <option value="none" selected>None</option>
                  <option value="bayer">Bayer</option>
                  <option value="floyd-steinberg">Floyd-Steinberg</option>
                </select>
              </label>
            </div>
            <div class="switches">
              <label class="switch"><input type="checkbox" name="alpha_refine" /><span></span>Alpha refine</label>
              <label class="switch"><input type="checkbox" name="temporal_alpha_stabilize" /><span></span>Temporal alpha</label>
              <label class="switch"><input type="checkbox" name="pixel_cleanup" /><span></span>Pixel cleanup</label>
              <label class="switch"><input type="checkbox" name="interpolation_skip_pixel_art" checked /><span></span>Hold pixel frames</label>
            </div>
          </details>
          <div class="switches">
            <label class="switch"><input type="checkbox" name="drop_loop_duplicate" checked /><span></span>Drop loop duplicate</label>
            <label class="switch"><input type="checkbox" name="preview_gif" checked /><span></span>Preview GIF</label>
            <label class="switch"><input type="checkbox" name="report" checked /><span></span>HTML report</label>
            <label class="switch"><input type="checkbox" name="power_of_two" /><span></span>Power-of-two sheet</label>
          </div>
          <button class="primary big" id="btnSubmitConvert" type="submit">Generate sprite</button>
        </form>
        <section class="card">
          <div class="card-head"><h3>Recent references</h3><button class="mini" id="refreshReferences" type="button">Refresh</button></div>
          <div id="referenceList" class="release-list">
            <div class="empty compact">No references uploaded yet.</div>
          </div>
        </section>
      </div>
    </section>
